version: "3.9"

services:
  echo:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - echo_data:/app/echo_data
    environment:
      ECHO_DB: /app/echo_data/echo.db
      # Optional. Direct-access mode does not require a shared secret.
      ECHO_AKOS_SHARED_SECRET: ${ECHO_AKOS_SHARED_SECRET:-}
      ECHO_AUTH_MAX_SKEW_SECONDS: ${ECHO_AUTH_MAX_SKEW_SECONDS:-300}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  echo_data:
