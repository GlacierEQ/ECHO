name: ECHO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q echo tests scripts
      - name: Lint
        run: ruff check --select E,F echo tests scripts
      - name: Behavioral tests
        run: pytest tests/ -v --tb=short
      - name: CLI verify
        run: python -m echo.cli verify
