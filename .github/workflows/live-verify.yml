name: ECHO Live Verify

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override live base URL (optional; defaults to repo variable ECHO_BASE_URL)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Resolve base URL
        id: config
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          VAR_BASE_URL: ${{ vars.ECHO_BASE_URL }}
          SECRET_BASE_URL: ${{ secrets.ECHO_BASE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${INPUT_BASE_URL:-}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="${VAR_BASE_URL:-}"
          fi
          if [ -z "$BASE_URL" ]; then
            BASE_URL="${SECRET_BASE_URL:-}"
          fi
          if [ -z "$BASE_URL" ]; then
            echo "::error::ECHO_BASE_URL is not configured."
            echo "Set repository variable ECHO_BASE_URL once, or pass base_url on workflow_dispatch."
            echo "No shared HMAC secret is required for this live path."
            exit 1
          fi
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Run live smoke (no shared secret required)
        env:
          ECHO_BASE_URL: ${{ steps.config.outputs.base_url }}
        run: |
          set -euo pipefail
          python scripts/live_smoke.py --base-url "$ECHO_BASE_URL"
