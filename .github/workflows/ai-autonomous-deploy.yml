name: AI Autonomous Deploy

# Environment approval required (GitHub environment: production).
# Triggers: push to main only. No remote dispatch. Deploy commands come from
# the repository spec file or a host-set secret, never from a caller payload.

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      root:
        description: "Repository root path"
        required: false
        type: string
        default: "."

permissions:
  contents: read

concurrency:
  group: ai-autonomous-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve specification
        id: spec
        env:
          EVENT_NAME: ${{ github.event_name }}
          SECRET_DEPLOY: ${{ secrets.DEPLOY_COMMAND || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] \
            && [ -z "${INPUT_SPEC}" ] \
            && [ -z "${PAYLOAD_DEPLOY}" ] \
            && [ -z "${SECRET_DEPLOY}" ] \
            && [ ! -f deploy.spec.json ]; then
            echo "::error::No external deployment specification or DEPLOY_COMMAND is configured for a main push."
            echo "Refusing to treat an ephemeral runner-local container as a production deployment."
            exit 78
          fi
          if [ -z "${HEALTH_URL:-}" ] && [ -n "${{ vars.ECHO_BASE_URL }}" ]; then
            echo "HEALTH_URL=${{ vars.ECHO_BASE_URL }}/health" >> "$GITHUB_ENV"
          fi
          if [ -z "${HEALTH_URL:-}" ] && [ -n "${{ secrets.ECHO_BASE_URL }}" ]; then
            echo "HEALTH_URL=${{ secrets.ECHO_BASE_URL }}/health" >> "$GITHUB_ENV"
          fi

      - name: Run autonomous deploy runner
        id: deploy
        env:
          DEPLOY_COMMAND: ${{ secrets.DEPLOY_COMMAND || '' }}
          DEPLOY_COMMAND_SOURCE: repo-secret
          ROLLBACK_COMMAND: ${{ secrets.ROLLBACK_COMMAND || '' }}
          HEALTH_URL: ${{ env.HEALTH_URL || '' }}
          DEPLOY_SPEC_JSON: ${{ env.DEPLOY_SPEC_JSON || '' }}
        run: |
          set -euo pipefail
          ROOT="${{ inputs.root || '.' }}"
          python3 ops/ai_deploy.py --root "$ROOT"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: |
            deployment-result.json
            deployment-artifacts/
          if-no-files-found: warn
