[project]
name = "echo"
version = "0.1.0"
description = "ECHO — Engine for Continuity, History, and Orchestration. The Piston to AKOS's Pillar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[project.scripts]
echo = "echo.cli:main"
echo-verify = "scripts.verify:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["echo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
